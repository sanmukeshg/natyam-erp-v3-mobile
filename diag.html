<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Viewport diagnostic</title>
<style>
    :root { --safe-b: env(safe-area-inset-bottom, 0px); }
    html, body { margin: 0; background: #3d1f11; color: #fff;
                 font: 13px/1.5 -apple-system, system-ui, sans-serif; }
    /* A full-viewport box styled exactly like .m-shell, so we can see whether
       it reaches the physical bottom of the screen. */
    .probe {
        height: 100vh; height: 100dvh;
        background: repeating-linear-gradient(45deg, #C05C3E 0 12px, #A2482E 12px 24px);
        display: flex; align-items: flex-end; justify-content: center;
        padding-bottom: 4px; box-sizing: border-box;
    }
    .probe b { background: #000; padding: 2px 8px; border-radius: 4px; }
    pre { margin: 0; padding: 12px; white-space: pre-wrap; word-break: break-all; font-size: 12px; }
    h1 { font-size: 15px; margin: 12px; }
</style>
</head>
<body>
<div class="probe"><b>&#9660; bottom edge of a 100dvh box</b></div>
<h1>Numbers to send back</h1>
<pre id="out">measuring…</pre>
<script>
    function px(el, value) {
        el.style.height = value;
        return el.getBoundingClientRect().height;
    }
    const t = document.createElement('div');
    t.style.cssText = 'position:fixed;top:0;left:0;width:1px;pointer-events:none;visibility:hidden';
    document.body.appendChild(t);

    const probe = document.querySelector('.probe').getBoundingClientRect();
    const cs = getComputedStyle(document.documentElement);

    const data = {
        standalone: (window.navigator.standalone === true) ? 'YES (installed PWA)'
                    : (matchMedia('(display-mode: standalone)').matches ? 'YES (display-mode)' : 'no (browser tab)'),
        screen: screen.width + ' x ' + screen.height,
        innerWH: innerWidth + ' x ' + innerHeight,
        clientWH: document.documentElement.clientWidth + ' x ' + document.documentElement.clientHeight,
        visualViewport: window.visualViewport
            ? Math.round(visualViewport.width) + ' x ' + Math.round(visualViewport.height)
              + '  offsetTop ' + Math.round(visualViewport.offsetTop)
            : 'unsupported',
        devicePixelRatio: devicePixelRatio,
        '100vh': px(t, '100vh'),
        '100svh': px(t, '100svh'),
        '100lvh': px(t, '100lvh'),
        '100dvh': px(t, '100dvh'),
        'safe-area-inset-top': cs.getPropertyValue('--safe-t') || getComputedStyle(document.body).getPropertyValue('padding-top'),
        probeBoxHeight: Math.round(probe.height),
        probeBottomY: Math.round(probe.bottom),
        GAP_below_probe: Math.round(document.documentElement.clientHeight - probe.bottom)
    };
    // safe-area insets read directly
    const s = document.createElement('div');
    s.style.cssText = 'position:fixed;visibility:hidden;top:0;left:0;'
        + 'padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);'
        + 'padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)';
    document.body.appendChild(s);
    const sc = getComputedStyle(s);
    data['safe-area top/bottom'] = sc.paddingTop + ' / ' + sc.paddingBottom;
    data['safe-area left/right'] = sc.paddingLeft + ' / ' + sc.paddingRight;
    s.remove(); t.remove();

    document.getElementById('out').textContent =
        Object.entries(data).map(([k, v]) => k.padEnd(22) + ' = ' + v).join('\n');
</script>
</body>
</html>
